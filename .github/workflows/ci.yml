name: Validate JobSync
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobsync
          POSTGRES_PASSWORD: ci-only-isolated-password
          POSTGRES_DB: jobsync_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobsync -d jobsync_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://jobsync:ci-only-isolated-password@localhost:5432/jobsync_test
      AUTH_SECRET: ci-only-signing-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate
      - run: npm run typecheck && npm run lint && npm run test:ci
      - run: node scripts/check-postgres.cjs
      - run: npm run test:migration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q ml-service/app scripts/export-sqlite.py
      - run: docker build -t jobsync-ci .
