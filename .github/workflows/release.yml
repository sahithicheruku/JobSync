name: Build release images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag
        required: true
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate tag and image namespace
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$ ]]
          echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}:${{ inputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}-ml:${{ inputs.tag }}
